<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h2>Employee Form</h2>
        <div class="row">
            <label for="">Employee name</label><br>
            <input type="text" id="employeeName">
        </div>
        <div class="row">
            <label for="">Username</label><br>
            <input type="text" id="username">
        </div>
        <div class="row">
            <label for="">Email address</label><br>
            <input type="email" id="email">
        </div>
        <div class="row">
            <label for="">phone number</label><br>
            <input type="text" id="phone">
        </div>
        <div class="row">
            <label for="">street</label><br>
            <input type="text" id="street">
        </div>
        <div class="row">
            <label for="">suite</label><br>
            <input type="text" id="suite">
        </div>
        <div class="row">
            <label for="">city</label><br>
            <input type="text" id="city">
        </div>
        <div class="row">
            <label for="">Website</label><br>
            <input type="url" id="website">
        </div>
        <div class="row">
            <label for="">company name</label><br>
            <input type="text" id="companyname">
        </div>
        <div class="row">
            <label for="">company slogan</label><br>
            <input type="text" id="companyslogan">
        </div>
        <div class="submit">
            <button type="submit" id="submitbtn">submit</button>
        </div>
    </form>

    <table id="userTable" style="display: none;">
        <label for="">Employee Table</label>
        <thead>
            <tr>Employee name</tr>
            <tr>Username</tr>
            <tr>Email address</tr>
            <tr>Phone number</tr>
            <tr>Street</tr>
            <tr>Suite</tr>
            <tr>City</tr>
            <tr>Website</tr>
            <tr>Company name</tr>
            <tr>Company slogan</tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script src="form.js"></script>
</body>
</html>
